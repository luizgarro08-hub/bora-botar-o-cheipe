databases:
  - name: neongym-db
    plan: free
    databaseName: neongym

services:
  - type: web
    name: neongym
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: neongym-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
